<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixi Responsive Carousel</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="pixi">
    <button id="prev" class="arrow" type="button" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="next" class="arrow" type="button" aria-label="Next slide">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="pagination" aria-label="Slides"></div>
  </div>
  <a id="credits" href="https://www.pexels.com/u/invisiblepower/" target="_blank" rel="noopener">
    Photo credits</a>
</body>
</html>
